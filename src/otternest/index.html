<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OtterNest · 小水獭窝</title>
<style>
:root{color-scheme:dark;--bg:#101927;--panel:#192638;--border:#32445b;--text:#eaf2fa;--muted:#aabed1;--accent:#7dd6bd;--danger:#f7a1a1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:18px max(24px,calc((100vw - 1120px)/2));border-bottom:1px solid var(--border);background:#142136}
h1{margin:0;font-size:24px}.subtitle{color:var(--muted);font-size:12px}.wrap{max-width:1120px;padding:24px;margin:auto}
button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;background:var(--accent);padding:9px 15px;color:#13272b;cursor:pointer;font-weight:600}
button.secondary{background:#344a64;color:var(--text)}button.danger{background:#743c49;color:#ffe9e9}button:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--border);border-radius:9px;background:#101b2a;color:var(--text);padding:10px;width:100%}textarea{resize:vertical;min-height:75px}
small,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:260px 1fr;gap:20px}.panel{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:20px;margin-bottom:18px}
nav button{display:block;width:100%;text-align:left;margin:8px 0;background:transparent;color:var(--text)}nav button.active{background:#315064;color:var(--accent)}
label{display:block;margin:12px 0 5px;color:var(--muted);font-size:13px}.stack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack>*{flex:1}
.row{padding:12px 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}.tag{font-size:12px;padding:3px 9px;background:#34566a;border-radius:18px;color:#b8e9d9}
#message{min-height:26px;color:var(--accent)}#message.error{color:var(--danger)}[hidden]{display:none!important}
code{overflow-wrap:anywhere;color:#a4e0d4}a{color:var(--accent)}h2{margin-top:0;font-size:18px}h3{font-size:15px;margin:12px 0 5px}
@media(max-width:760px){.layout{grid-template-columns:1fr}header{padding:16px 20px}.wrap{padding:16px}.stack{display:block}.stack>*{margin-bottom:7px}}
</style></head>
<body><header><div><h1>🦦 OtterNest</h1><div class="subtitle">小水獭窝 · AI Team OS</div></div><span class="tag">自托管控制中心</span></header>
<main class="wrap"><div id="login" class="panel"><h2>管理员连接</h2><p class="muted">输入管理员令牌。令牌仅保存在当前页面内存中，不写入浏览器存储。</p><div class="stack"><input id="ownerToken" type="password" autocomplete="off" placeholder="OTTERNEST_OWNER_TOKEN"><button onclick="login()">连接</button></div></div>
<div id="dashboard" hidden><div class="layout"><aside class="panel"><h2>指挥中心</h2><div class="muted">当前项目</div><select id="projectSelect" onchange="refresh()"></select><nav id="nav"></nav><button class="secondary" onclick="logout()">退出控制台</button></aside>
<section><div id="message" role="status"></div><div id="view"></div></section></div></div></main>
<script>
let token="",project="",page="overview",projects=[],agents=[],currentPlan=null;
const api=async(path,method="GET",data)=>{const response=await fetch('/api/v1'+path,{method,headers:{'Authorization':'Bearer '+token,...(data!==undefined?{'Content-Type':'application/json'}:{})},body:data===undefined?undefined:JSON.stringify(data)});const out=await response.json();if(!response.ok)throw Error(out.detail||response.statusText);return out};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notice=(text,isError=false)=>{let el=document.getElementById('message');el.textContent=text;el.className=isError?'error':''};
const safe=async(fn)=>{try{await fn()}catch(e){notice(e.message,true)}};
async function login(){await safe(async()=>{token=document.getElementById('ownerToken').value;await api('/me');document.getElementById('ownerToken').value='';document.getElementById('login').hidden=true;document.getElementById('dashboard').hidden=false;await refresh()})}
function logout(){token='';document.getElementById('dashboard').hidden=true;document.getElementById('login').hidden=false;document.getElementById('view').textContent=''}
async function refresh(){await safe(async()=>{projects=await api('/projects');agents=await api('/agents');const sel=document.getElementById('projectSelect');let current=sel.value||project;sel.innerHTML='<option value="">选择项目</option>'+projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');project=projects.find(p=>p.id===current)?.id||projects[0]?.id||'';sel.value=project;renderNav();await render()})}
function renderNav(){document.getElementById('nav').innerHTML=['overview:概览','commands:操作预览','tasks:任务','agents:Agent','memories:知识与决策','events:事件'].map(e=>{let [id,label]=e.split(':');return `<button class="${page===id?'active':''}" onclick="setPage('${id}')">${label}</button>`}).join('')}
function setPage(p){page=p;renderNav();safe(render)}
function item(html){return `<div class="row">${html}</div>`}
async function render(){const root=document.getElementById('view');if(page==='overview'){root.innerHTML=`<div class="panel"><h2>项目总览</h2><p class="muted">当前 ${projects.length} 个项目，${agents.length} 个 Agent。所有显示内容来自中央数据库。</p><h3>新建项目</h3><form onsubmit="createProject(event)"><label>名称</label><input name="name" required maxlength="160"><label>描述</label><textarea name="description"></textarea><button>创建项目</button></form></div>`;return}
if(page==='agents'){root.innerHTML=`<div class="panel"><h2>Agent 目录与执行环境</h2><p class="muted">声明能力不等于已验证能力；执行实例的状态由其自己上报，不能代表第三方平台提供了可验证的远程运行证据。</p>${agents.map(a=>item(`<strong>${esc(a.name)}</strong> <span class="tag">${esc(a.platform)}</span><br><small>${esc(a.execution_mode)} · ${a.enabled?'已启用':'已禁用'} · 声明：${esc((a.declared_capabilities||[]).join(', ')||'无')} · 已验证：${esc((a.verified_capabilities||[]).join(', ')||'无')}</small><p><button class="secondary" onclick="showRuntimes('${esc(a.id)}')">运行实例</button> <button class="secondary" onclick="verifyCapabilities('${esc(a.id)}')">确认能力</button></p><div id="runtime-${esc(a.id)}"></div>`)).join('')||'<p class="muted">暂无 Agent</p>'}${project?`<h3>将 Agent 加入当前项目</h3><form onsubmit="addMember(event)"><label>Agent</label><select name="agent_id">${agents.filter(a=>a.enabled).map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select><label>项目角色</label><select name="role"><option>worker</option><option>manager</option><option>reviewer</option><option>advisor</option></select><button>分配项目权限</button></form>`:''}<h3>注册 Agent</h3><form onsubmit="createAgent(event)"><label>名称</label><input name="name" required><label>平台</label><input name="platform" required><label>声明能力（小写标识，逗号分隔）</label><input name="capabilities" placeholder="python, browser"><label>运行方式</label><select name="execution_mode"><option value="manual">人工接入</option><option value="polling">主动轮询</option><option value="remote">远程调用</option></select><button>注册</button></form><p class="muted">新令牌仅在注册后展示一次，请妥善保存。当前不自动检测平台是否支持实际接单。</p><pre id="newToken"></pre></div>`;return}
if(!project){root.innerHTML='<div class="panel"><h2>尚无项目</h2><button onclick="setPage(\'overview\')">先创建一个项目</button></div>';return}
if(page==='commands'){
const tasks=await api('/projects/'+project+'/tasks');
const members=await api('/projects/'+project+'/members');
root.innerHTML=`<div class="panel"><h2>受控指挥 · 操作预览</h2><p class="muted">支持列出的中文句式与结构化表单，不具备自由自然语言推理。两种方式都只生成待确认预览；系统在确认时核对版本、权限及风险。预览在 10 分钟后过期。</p>
<h3>受限中文指令（不会自动执行）</h3>
<p class="muted">支持：批准任务「标题」、取消任务「标题」、验收通过任务「标题」、验收驳回任务「标题」原因：理由、指派任务「标题」给「Agent名称」。同名使用 UUID。未匹配指令会拒绝；不调用大模型。</p>
<form onsubmit="previewNaturalCommand(event)"><label>操作指令</label><textarea name="text" required minlength="4" maxlength="3500" placeholder="请批准任务「修复登录问题」。"></textarea><button>解析并生成预览</button></form>
<h3>结构化操作</h3><form onsubmit="previewCommand(event)"><label>任务</label><select name="task_id" required>${tasks.map(t=>`<option value="${esc(t.id)}">${esc(t.title)} · ${esc(t.status)} · v${esc(t.version)}</option>`).join('')}</select>
<label>操作</label><select name="action" onchange="toggleCommandFields(this.form)"><option value="authorize_task">批准高风险任务</option><option value="review_task">验收任务</option><option value="route_task">设置执行 Agent</option><option value="cancel_task">取消任务</option></select>
<div data-field="review" hidden><label>验收结果</label><select name="accepted"><option value="true">通过</option><option value="false">要求修改</option></select><label>验收说明（拒绝时必填）</label><textarea name="reason" maxlength="3000"></textarea></div>
<div data-field="route" hidden><label>执行 Agent</label><select name="target_agent_id"><option value="">不指定</option>${members.filter(m=>m.enabled&&['worker','manager','reviewer'].includes(m.role)).map(m=>`<option value="${esc(m.agent_id)}">${esc(m.agent_name)}</option>`).join('')}</select></div>
<button>生成待确认预览</button></form><div id="commandPreview" aria-live="polite"></div></div>`;
return;
}
if(page==='tasks'){
const graph=await api('/projects/'+project+'/task-graph'), tasks=graph.tasks, edges=graph.dependencies;
const members=await api('/projects/'+project+'/members');
const nameById=Object.fromEntries(tasks.map(t=>[t.id,t.title]));
const eligible=members.filter(m=>m.enabled&&['worker','manager','reviewer'].includes(m.role));
root.innerHTML=`<div class="panel"><h2>项目任务与依赖</h2><p><button class="secondary" onclick="schedule()">按已验证能力调度在线 Agent</button></p><p class="muted">任务只有在前置任务通过验收后才可领取；调度只标记接单候选者，不会直接启动远程进程。</p>
${tasks.map(t=>{let deps=edges.filter(d=>d.task_id===t.id).map(d=>nameById[d.depends_on_id]||d.depends_on_id);
return item(`<strong>${esc(t.title)}</strong> <span class="tag">${esc(t.status)} · ${esc(t.risk)} · P${esc(t.priority)}</span><p class="muted">${esc(t.acceptance)}</p><small>需求能力：${esc((t.required_capabilities||[]).join(', ')||'无')}<br>${deps.length?'前置：'+deps.map(esc).join('、'):'无前置任务'} · 指派：${esc(eligible.find(m=>m.agent_id===t.target_agent_id)?.agent_name||'未指定')}</small>
${['ready','waiting_dependencies','waiting_approval'].includes(t.status)?`<p class="stack"><select id="target-${esc(t.id)}"><option value="">不指定 Agent</option>${eligible.map(m=>`<option value="${esc(m.agent_id)}" ${m.agent_id===t.target_agent_id?'selected':''}>${esc(m.agent_name)} (${esc(m.role)})</option>`).join('')}</select><button class="secondary" onclick="targetTask('${esc(t.id)}')">设定执行者</button></p>`:''}
${t.status==='waiting_approval'?`<p><button onclick="action('${esc(t.id)}','authorize')">授权</button></p>`:''}
${t.status==='submitted'?`<p><button onclick="review('${esc(t.id)}',true)">验收通过</button> <button class="secondary" onclick="review('${esc(t.id)}',false)">要求修改</button></p>`:''}`)}).join('')||'<p class="muted">暂无任务</p>'}
<h3>创建任务</h3><form onsubmit="createTask(event)"><label>标题</label><input name="title" required maxlength="240"><label>执行说明</label><textarea name="instruction" required></textarea><label>验收标准</label><textarea name="acceptance" required></textarea>
<label>优先级（0–100）</label><input name="priority" type="number" value="50" min="0" max="100" required><label>任务所需已验证能力（小写标识，逗号分隔）</label><input name="required_capabilities" placeholder="python, testing"><label>前置任务（可多选）</label>
<select name="dependencies" multiple size="${Math.max(2,Math.min(6,tasks.length))}">${tasks.map(t=>`<option value="${esc(t.id)}">${esc(t.title)} · ${esc(t.status)}</option>`).join('')}</select><small>按 Ctrl 或 Cmd 多选；没有前置任务可以留空。</small>
<label>风险</label><select name="risk"><option>R0</option><option selected>R1</option><option>R2</option><option>R3</option></select><button>创建</button></form></div>`;return}
if(page==='memories'){let [ms,ds]=await Promise.all([api('/projects/'+project+'/memories'),api('/projects/'+project+'/decisions')]);root.innerHTML=`<div class="panel"><h2>项目记忆</h2>${ms.map(m=>item(`<strong>${esc(m.title)}</strong> <span class="tag">${esc(m.status)}</span><p>${esc(m.content)}</p>${m.status==='proposed'?`<button onclick="publish('${esc(m.id)}')">发布</button>`:''}`)).join('')||'<p class="muted">暂无记忆</p>'}<form onsubmit="createMemory(event)"><h3>提出知识记录</h3><label>标题</label><input name="title" required><label>内容</label><textarea name="content" required></textarea><label>出处</label><input name="source" required><button>提交提案</button></form></div><div class="panel"><h2>决策</h2>${ds.map(d=>item(`<strong>${esc(d.question)}</strong><p>${esc(d.resolution)}</p><span class="tag">${esc(d.status)}</span><p><button class="secondary" onclick="showDecisionReviews('${esc(d.id)}')">查看独立意见</button> ${d.status==='proposed'?`<button onclick="resolveDecision('${esc(d.id)}')">确认决策</button> <button class="secondary" onclick="openDeliberation('${esc(d.id)}')">开启二轮</button> <button class="secondary" onclick="showDeliberation('${esc(d.id)}')">查看二轮</button>`:''}</p><div id="reviews-${esc(d.id)}"></div><div id="deliberation-${esc(d.id)}"></div>`)).join('')||'<p class="muted">暂无决策</p>'}<form onsubmit="createDecision(event)"><h3>提出决策</h3><label>问题</label><textarea name="question" required></textarea><label>结论</label><textarea name="resolution" required></textarea><label>依据</label><textarea name="rationale" required></textarea><button>提交提案</button></form></div>`;return}
if(page==='events'){let ev=await api('/projects/'+project+'/events');root.innerHTML=`<div class="panel"><h2>项目事件时间线</h2>${ev.map(e=>item(`<strong>${esc(e.kind)}</strong><br><small>${esc(e.subject_id)} · ${esc(e.created_at)}</small>`)).join('')||'<p class="muted">暂无事件</p>'}</div>`}}
function toggleCommandFields(f){f.querySelector('[data-field="review"]').hidden=f.action.value!=='review_task';f.querySelector('[data-field="route"]').hidden=f.action.value!=='route_task'}
function showCommandPlan(plan){currentPlan=plan.id;const dest=document.getElementById('commandPreview');dest.innerHTML=`<h3>等待确认</h3><p>任务：${esc(plan.task_title)}（${esc(plan.task_status)}）</p><p>操作：${esc(plan.action)} · 风险：${esc(plan.task_risk)} · 版本：${esc(plan.expected_version)}</p><p>参数：<code>${esc(JSON.stringify(plan.parameters))}</code></p><small>截至 ${esc(plan.expires_at)} 有效。状态改变后必须重新预览。</small><p><button class="danger" onclick="confirmCurrentPlan()">确认执行此操作</button> <button class="secondary" onclick="discardCommandPreview()">放弃</button></p>`;notice('已生成预览，未执行');}
async function previewNaturalCommand(e){e.preventDefault();await safe(async()=>{const data=form(e);const plan=await api('/command/interpret','POST',{project_id:project,text:data.text});showCommandPlan(plan)})}
async function previewCommand(e){e.preventDefault();await safe(async()=>{const data=form(e);const body={task_id:data.task_id,action:data.action};if(body.action==='review_task'){body.accepted=data.accepted==='true';body.reason=data.reason||''}if(body.action==='route_task'){body.target_agent_id=data.target_agent_id||null}const plan=await api('/command/plans','POST',body);showCommandPlan(plan)})}
function discardCommandPreview(){currentPlan=null;const el=document.getElementById('commandPreview');if(el)el.textContent='已放弃本次预览（不执行）。'}
async function confirmCurrentPlan(){if(!currentPlan)return;await safe(async()=>{const id=currentPlan;const result=await api('/command/plans/'+id+'/confirm','POST');currentPlan=null;notice('已执行并记录：'+result.result.status);await render()})}
async function showDecisionReviews(id){await safe(async()=>{const reviews=await api('/decisions/'+id+'/reviews');const el=document.getElementById('reviews-'+id);el.innerHTML='<strong>独立意见（证据尚未自动核验）</strong>'+ (reviews.map(r=>item(`<span class="tag">${esc(r.stance)}</span> <small>${esc(r.agent_id)}</small><p>${esc(r.reasoning)}</p><small>证据来源：${esc(r.evidence.join(', ')||'未提供')}</small>`)).join('')||'<p class="muted">暂无独立意见</p>');})}
async function openDeliberation(id){await safe(async()=>{await api('/decisions/'+id+'/deliberation/open','POST');notice('二轮协商已开启，仅第一轮参与者可以回应');await showDeliberation(id)})}
async function showDeliberation(id){await safe(async()=>{const data=await api('/decisions/'+id+'/deliberation');const root=document.getElementById('deliberation-'+id);if(!root)return;root.textContent='二轮协商：'+data.status+'，证据引用尚未独立核实';const pre=document.createElement('pre');pre.textContent=JSON.stringify({first_round:data.first_round,rebuttals:data.rebuttals},null,2);pre.style.whiteSpace='pre-wrap';root.appendChild(pre);if(data.status==='open'){const button=document.createElement('button');button.className='secondary';button.textContent='关闭二轮协商';button.onclick=()=>closeDeliberation(id);root.appendChild(button)}})}
async function closeDeliberation(id){await safe(async()=>{const reason=prompt('请输入结束第二轮的实质说明（至少10字）');if(reason===null)return;await api('/decisions/'+id+'/deliberation/close','POST',{reason});notice('第二轮已关闭，仍需管理员裁决');await showDeliberation(id)})}
async function resolveDecision(id){await safe(async()=>{const reviews=await api('/decisions/'+id+'/reviews');const hasDissent=reviews.some(x=>x.stance==='oppose'||x.stance==='alternative');const note=prompt(hasDissent?'存在异议，请说明你如何处理不同意见（至少10字）':'决策批准说明（第二轮存在异议时至少10字）','');if(note===null)return;const response=await api('/decisions/'+id+'/resolve','POST',{owner_note:note});notice('已确认决策，记录异议数：'+response.dissent_count);await render()})}
const form=e=>Object.fromEntries(new FormData(e.target).entries());
function parseCapabilities(value){return String(value||'').split(',').map(x=>x.trim()).filter(Boolean)}
async function schedule(){await safe(async()=>{const result=await api('/projects/'+project+'/schedule','POST',{limit:20});notice('已匹配 '+result.count+' 项任务；实际执行须由 Agent 领取');await render()})}
async function showRuntimes(id){await safe(async()=>{const list=await api('/agents/'+id+'/runtimes');const el=document.getElementById('runtime-'+id);el.innerHTML=list.map(r=>item(`<small>${esc(r.label)} · ${esc(r.environment)} · ${esc(r.status)} · 最近上报：${esc(r.last_seen||'从未')} · ${r.online?'在线上报':'离线/未知'} ${r.enabled?'':'· 已禁用'}</small>`)).join('')+`<form onsubmit="registerRuntime(event,'${esc(id)}')"><label>运行实例名称</label><input name="label" required><label>执行环境</label><input name="environment" required><button>注册实例</button></form>`;})}
async function registerRuntime(e,id){e.preventDefault();await safe(async()=>{await api('/agents/'+id+'/runtimes','POST',form(e));notice('实例已注册，须由该 Agent 主动上报心跳');await showRuntimes(id)})}
async function verifyCapabilities(id){await safe(async()=>{const record=agents.find(a=>a.id===id);if(!record)return;const input=prompt('输入已独立验证的能力（逗号分隔，不得超出声明范围）',(record.verified_capabilities||[]).join(', '));if(input===null)return;const approved=parseCapabilities(input);if(!approved.every(c=>(record.declared_capabilities||[]).includes(c))){notice('不能验证未声明的能力',true);return}await api('/agents/'+id+'/verified-capabilities','PUT',{capabilities:approved});notice('已记录能力核验，请确保已在真实环境完成验证');await refresh()})}
async function createProject(e){e.preventDefault();await safe(async()=>{await api('/projects','POST',form(e));notice('项目已创建');await refresh()})}
async function createAgent(e){e.preventDefault();await safe(async()=>{const body=form(e);body.capabilities=parseCapabilities(body.capabilities);const a=await api('/agents','POST',body);await refresh();document.getElementById('newToken').textContent='仅显示一次：'+a.token;notice('Agent 已注册，请分配项目成员权限后使用')})}
async function addMember(e){e.preventDefault();await safe(async()=>{await api('/projects/'+project+'/members','POST',form(e));notice('已分配项目角色');await render()})}
async function createTask(e){e.preventDefault();await safe(async()=>{const body=form(e);body.priority=Number(body.priority);body.required_capabilities=parseCapabilities(body.required_capabilities);body.dependency_ids=[...new FormData(e.target).getAll('dependencies')];delete body.dependencies;await api('/projects/'+project+'/tasks','POST',body);notice('任务已创建');await render()})}
async function targetTask(id){await safe(async()=>{const target=document.getElementById('target-'+id).value;await api('/tasks/'+id+'/target','PUT',{agent_id:target||null});notice('执行者指向已保存；远程进程需自行领取');await render()})}
async function createMemory(e){e.preventDefault();await safe(async()=>{await api('/projects/'+project+'/memories','POST',form(e));notice('记忆提案已创建');await render()})}
async function createDecision(e){e.preventDefault();await safe(async()=>{await api('/projects/'+project+'/decisions','POST',form(e));notice('决策提案已创建');await render()})}
async function action(id,verb){await safe(async()=>{if(!confirm('确认执行此管理操作？'))return;await api('/tasks/'+id+'/'+verb,'POST');notice('操作已记录');await render()})}
async function review(id,accepted){await safe(async()=>{if(!confirm('确认验收决定？'))return;await api('/tasks/'+id+'/review','POST',{accepted,reason:''});notice('验收决定已记录');await render()})}
async function publish(id){await safe(async()=>{await api('/memories/'+id+'/publish','POST');notice('记忆已发布');await render()})}
async function approve(id){await safe(async()=>{await api('/decisions/'+id+'/approve','POST');notice('决策已批准');await render()})}
</script></body></html>
