[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otternest"
version = "0.1.0"
description = "Self-hosted governance and collaboration control plane for AI teams"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1"
]

[project.scripts]
otternest-runner = "otternest.runner:main"
otternest-webhooks = "otternest.webhooks:main"
otternest-mcp = "otternest.mcp_bridge:main"
otternest-scheduler = "otternest.scheduler:main"
otternest-a2a-outbound = "otternest.a2a_outbound:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
mcp = ["mcp>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
otternest = ["index.html"]
